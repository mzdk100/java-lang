[package]
name = "java-lang"
version = "0.5.0"
edition = "2024"
description = "A Java AST parser in Rust, syn-style API for Java 25 (JLS SE 25)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mzdk100/java-lang"
readme = "README.md"
keywords = ["java", "parser", "ast", "jls", "java25"]
categories = ["parser-implementations"]

[dependencies]
thiserror = "2"
unicode-xid = "0.2"

[dev-dependencies]
walkdir = "2"

[features]
default = []
# Enable extra diagnostics and span information
full = []
